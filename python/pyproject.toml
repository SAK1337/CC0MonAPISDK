[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cc0mon-sdk"
version = "0.1.0"
description = "Reference Python SDK for the cc0mon.com NFT API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Special Agent K" }]
keywords = ["cc0mon", "nft", "ethereum", "cc0"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://cc0mon.com"
Documentation = "https://api.cc0mon.com"
Source = "https://github.com/Special-Agent-K/CC0MonAPISDK"

[tool.setuptools]
packages = ["cc0mon_sdk"]
